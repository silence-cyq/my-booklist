<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>我的书单｜浏览版</title>
<style>
    :root{
      --ink:#172033;--muted:#718096;--line:#e4e9ef;--paper:#fff;--bg:#f5f2eb;
      --deep:#0b211b;--deep2:#12372e;--green:#0f766e;--green2:#0b4f49;
      --gold:#d7a843;--soft:#f0f7f4;--danger:#b42318;--shadow:0 15px 40px rgba(16,24,40,.08);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;line-height:1.65}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    .app{display:grid;grid-template-columns:275px minmax(0,1fr);min-height:100vh}
    .sidebar{background:linear-gradient(180deg,#081a15 0%,#0d2a22 60%,#0d3228 100%);color:#e9f5f0;padding:24px 18px 28px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
    .brand{display:flex;align-items:center;gap:12px;padding:2px 7px 22px}
    .brand-mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#e2bf6b,#fff0c6);color:#17382c;display:grid;place-items:center;font-weight:900;font-size:20px;box-shadow:0 8px 20px rgba(0,0,0,.18)}
    .brand h1{font-size:21px;margin:0;letter-spacing:-.02em}
    .brand p{margin:2px 0 0;font-size:11px;color:#9fbdb3;letter-spacing:.12em}
    .sidebar-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 5px 16px}
    .side-stat{background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 11px}
    .side-stat b{display:block;font-size:20px;color:#fff;line-height:1.15}
    .side-stat span{font-size:10px;color:#9fbdb3}
    .side-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:0 5px 16px}
    .side-btn{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);color:#e8f3ef;border-radius:10px;padding:9px 8px;font-size:11.5px;text-align:center}
    .side-btn:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.22)}
    .side-btn.primary{background:#e4bc62;color:#21352c;border-color:#e4bc62;font-weight:700}
    .side-nav{overflow:auto;padding:0 5px 20px;flex:1;scrollbar-width:thin}
    .side-all{display:flex;justify-content:space-between;padding:9px 10px;border-radius:10px;font-size:12.5px;cursor:pointer;color:#dcede7;margin-bottom:7px}
    .side-all.active{background:rgba(228,188,98,.18);color:#ffe4a4}
    .side-theme{margin:8px 0 3px}
    .side-theme summary{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:9px;list-style:none;font-size:12px;color:#bcd2ca;cursor:pointer}
    .side-theme summary::-webkit-details-marker{display:none}
    .theme-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
    .side-theme summary b{font-weight:600;flex:1}
    .side-theme summary small{font-size:10px;color:#7f9d93}
    .side-categories{padding:2px 0 4px 18px}
    .side-cat{display:block;width:100%;border:0;background:none;color:#a9c4ba;text-align:left;padding:4px 7px;border-radius:7px;font-size:11.5px;line-height:1.45}
    .side-cat:hover{background:rgba(255,255,255,.06);color:#fff}
    .side-cat.active{background:rgba(228,188,98,.16);color:#ffe4a4}
    .side-cat span{float:right;color:#78988d;font-size:10px;margin-left:5px}
    .side-foot{font-size:10px;color:#739187;padding:10px 9px 0;border-top:1px solid rgba(255,255,255,.08)}
    .main{min-width:0;padding:0 30px 70px}
    .topbar{position:sticky;top:0;z-index:30;padding:18px 0 14px;background:rgba(245,242,235,.93);backdrop-filter:blur(15px);border-bottom:1px solid rgba(210,218,226,.65)}
    .topline{display:flex;gap:10px;align-items:center}
    .search{position:relative;flex:1}
    .search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:17px;color:#8b99a8}
    .search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px 44px 13px 43px;outline:none;font-size:14px;box-shadow:0 4px 14px rgba(16,24,40,.035)}
    .search input:focus{border-color:#85c8bb;box-shadow:0 0 0 4px rgba(15,118,110,.09)}
    .clear-search{position:absolute;right:11px;top:50%;transform:translateY(-50%);border:0;background:#edf2f4;border-radius:50%;width:27px;height:27px;color:#6f7c8a;display:none}
    .add-btn{border:0;background:var(--deep2);color:#fff;border-radius:13px;padding:12px 17px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:7px;box-shadow:0 8px 20px rgba(18,55,46,.18)}
    .add-btn:hover{background:var(--green)}
    .filter-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:11px}
    .status-tabs{display:flex;background:#e9e7e1;border-radius:11px;padding:3px;gap:2px}
    .status-tab{border:0;background:none;color:#667085;padding:7px 13px;border-radius:8px;font-size:12px}
    .status-tab.active{background:#fff;color:var(--deep2);font-weight:700;box-shadow:0 2px 7px rgba(0,0,0,.05)}
    .random-btn{margin-left:auto;border:1px solid var(--line);background:#fff;color:#40564e;padding:8px 12px;border-radius:10px;font-size:12px}
    .random-btn:hover{border-color:#c9b476;color:#7a5a13}
    .hero{margin:22px 0 20px;border-radius:22px;padding:30px 32px;background:linear-gradient(135deg,#0b211b,#143d33 62%,#3b6e5d);color:#fff;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:22px;align-items:center;box-shadow:var(--shadow);overflow:hidden;position:relative}
    .hero::after{content:"";position:absolute;width:330px;height:330px;border-radius:50%;right:-130px;top:-180px;background:radial-gradient(circle,rgba(226,191,107,.28),transparent 68%)}
    .hero-kicker{font-size:10px;letter-spacing:.18em;color:#b9d6cc;margin-bottom:7px}
    .hero h2{font-size:32px;line-height:1.2;margin:0;letter-spacing:-.03em}
    .hero p{margin:9px 0 0;color:#c9ddd5;font-size:13.5px;max-width:650px}
    .spotlight{position:relative;z-index:1;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:15px;padding:16px 17px;min-height:130px;display:flex;flex-direction:column;justify-content:space-between}
    .spotlight small{font-size:10px;color:#b8d1c8;letter-spacing:.12em}
    .spotlight h3{font-size:18px;line-height:1.35;margin:5px 0 2px;color:#fff}
    .spotlight p{font-size:12px;color:#c4d9d1;margin:2px 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .spotlight button{align-self:flex-start;border:0;background:#e4bc62;color:#20342c;border-radius:8px;padding:7px 10px;font-size:11px;font-weight:700}
    .result-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 2px 15px;color:var(--muted);font-size:12px}
    .result-meta strong{color:var(--ink)}
    .category-section{margin:0 0 30px}
    .category-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 1px 11px}
    .category-head h3{font-size:21px;margin:0;color:var(--deep);letter-spacing:-.02em}
    .category-head p{margin:4px 0 0;color:var(--muted);font-size:12px}
    .category-numbers{font-size:11px;color:var(--muted);white-space:nowrap}
    .book-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .book-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px 16px 13px;min-height:205px;display:flex;flex-direction:column;position:relative;box-shadow:0 4px 15px rgba(16,24,40,.03);transition:.18s ease}
    .book-card:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(16,24,40,.08);border-color:#c6d6d0}
    .book-card.read{background:#f1f7f4;border-color:#cfe2d9}
    .card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:10px}
    .badges{display:flex;gap:5px;flex-wrap:wrap;min-width:0}
    .badge{font-size:9.5px;padding:2px 6px;border-radius:999px;background:#eef3f5;color:#5b6b78;white-space:nowrap}
    .badge.new{background:#fff2c9;color:#8a5a00}
    .badge.read{background:#dff3e9;color:#176448}
    .card-actions{display:flex;gap:3px;opacity:0;transition:.15s}
    .book-card:hover .card-actions{opacity:1}
    .icon-btn{border:0;background:#f5f7f9;color:#6b7b88;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px}
    .icon-btn:hover{background:#e8eef1;color:#233b35}
    .icon-btn.danger:hover{background:#fee4e2;color:var(--danger)}
    .book-title{font-size:16px;line-height:1.45;margin:0 0 3px;color:#172a36;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .author{font-size:11px;color:#82909e;min-height:18px;margin-bottom:7px}
    .intro{font-size:12.5px;color:#4e5d6b;line-height:1.65;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1}
    .book-note{font-size:11px;color:#8b641c;background:#fff8e4;border-radius:7px;padding:5px 7px;margin-top:7px}
    .card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid #edf1f4;margin-top:11px;padding-top:9px}
    .read-state{font-size:10.5px;color:#96a1ad}
    .read-state.done{color:#147a58;font-weight:700}
    .read-toggle{border:1px solid #dce5e9;background:#fff;color:#526271;border-radius:8px;padding:5px 8px;font-size:10.5px}
    .read-toggle:hover{border-color:#90cbbd;color:var(--green)}
    .empty{display:none;background:#fff;border:1px dashed #d6dde5;border-radius:18px;padding:55px 20px;text-align:center;color:var(--muted)}
    .empty strong{display:block;color:var(--ink);font-size:19px;margin-bottom:5px}
    .modal{position:fixed;inset:0;z-index:100;background:rgba(6,20,16,.55);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:18px}
    .modal.open{display:flex}
    .dialog{background:#fff;border-radius:20px;width:min(600px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.25)}
    .dialog-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px 14px;border-bottom:1px solid var(--line)}
    .dialog-head h3{margin:0;font-size:21px}
    .dialog-close{border:0;background:#f0f3f5;border-radius:50%;width:32px;height:32px;font-size:18px;color:#667085}
    .form{padding:18px 22px 22px;display:grid;gap:14px}
    .field label{display:block;font-size:11px;font-weight:700;color:#50606c;margin-bottom:5px;letter-spacing:.03em}
    .field input,.field textarea,.field select{width:100%;border:1px solid #dce4ea;border-radius:10px;padding:10px 11px;outline:none;background:#fbfcfd;font-size:13px}
    .field textarea{min-height:78px;resize:vertical}
    .field input:focus,.field textarea:focus,.field select:focus{border-color:#8acfc1;box-shadow:0 0 0 3px rgba(15,118,110,.08);background:#fff}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .check-line{display:flex;align-items:center;gap:8px;font-size:13px;color:#475467}
    .check-line input{width:17px;height:17px;accent-color:var(--green)}
    .form-actions{display:flex;gap:8px;justify-content:flex-end;padding-top:4px}
    .btn{border:1px solid #dce4ea;background:#fff;color:#475467;border-radius:10px;padding:10px 14px;font-size:13px}
    .btn.primary{background:var(--deep2);border-color:var(--deep2);color:#fff;font-weight:700}
    .btn.danger{margin-right:auto;color:var(--danger);border-color:#f2cbc7}
    .toast{position:fixed;right:24px;bottom:24px;z-index:200;background:#173a30;color:#fff;border-radius:12px;padding:11px 15px;font-size:12px;box-shadow:0 14px 30px rgba(0,0,0,.2);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}
    .toast.show{opacity:1;transform:translateY(0)}
    .hidden{display:none!important}
    @media(max-width:1120px){.book-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr}}
    @media(max-width:900px){
      .app{display:block}
      .sidebar{position:static;height:auto;padding:17px 14px 15px}
      .side-nav{max-height:260px}
      .main{padding:0 14px 55px}
      .hero{padding:24px 20px}
      .hero h2{font-size:26px}
    }
    @media(max-width:620px){
      .book-grid{grid-template-columns:1fr}
      .topline{flex-wrap:wrap}
      .search{flex-basis:100%}
      .add-btn{width:100%;justify-content:center}
      .random-btn{margin-left:0}
      .two-col{grid-template-columns:1fr}
      .category-head{align-items:flex-start}
      .sidebar-stats{grid-template-columns:repeat(4,1fr)}
      .side-stat b{font-size:17px}
    }
  </style>
<style>
.share-mode .sidebar-stats,
.share-mode .side-actions,
.share-mode .add-btn,
.share-mode .status-tabs,
.share-mode .card-actions,
.share-mode .read-toggle,
.share-mode .read-state,
.share-mode .card-foot,
.share-mode .side-foot,
.share-mode .result-meta #activeFilter { display:none !important; }
.share-mode .book-card { min-height:170px; }
.share-mode .random-btn { margin-left:0; }
.share-mode .hero { grid-template-columns:minmax(0,1fr) 310px; }
@media(max-width:900px){ .share-mode .hero { grid-template-columns:1fr; } }
</style></head>
<body class="share-mode">
<div class="app">
<aside class="sidebar">
<div class="brand">
<div class="brand-mark">书</div>
<div><h1>我的书单</h1><p>READ · REMEMBER · RETURN</p></div>
</div>
<div class="sidebar-stats">
<div class="side-stat"><b id="statTotal">0</b><span>全部</span></div>
<div class="side-stat"><b id="statRead">0</b><span>已读</span></div>
<div class="side-stat"><b id="statUnread">0</b><span>未读</span></div>
<div class="side-stat"><b id="statRate">0%</b><span>完成度</span></div>
</div>
<div class="side-actions">
<button class="side-btn primary" id="sideAdd">＋ 添加书籍</button>
<button class="side-btn" id="exportBtn">导出备份</button>
<button class="side-btn" id="importBtn">导入备份</button>
<button class="side-btn" id="randomSide">随机未读</button>
</div>
<nav class="side-nav" id="sideNav"></nav>
<div class="side-foot">数据保存在当前浏览器。建议定期导出备份。</div>
</aside>
<main class="main">
<div class="topbar">
<div class="topline">
<div class="search">
<svg fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input autocomplete="off" id="searchInput" placeholder="搜索书名、作者、分类或说明…" type="search"/>
<button class="clear-search" id="clearSearch">×</button>
</div>
<button class="add-btn" id="topAdd">＋ 添加书籍</button>
</div>
<div class="filter-row">
<div class="status-tabs">
<button class="status-tab active" data-status="all">全部</button>
<button class="status-tab" data-status="unread">未读</button>
<button class="status-tab" data-status="read">已读</button>
</div>
<button class="random-btn" id="randomTop">🎲 随机抽一本</button>
</div>
</div>
<section class="hero">
<div>
<div class="hero-kicker">PERSONAL READING SYSTEM</div>
<h2>想读的，不再忘记。</h2>
<p>公开展示版：按主题和类目浏览、搜索书目。</p>
</div>
<div class="spotlight" id="spotlight">
<div>
<small>TODAY'S PICK</small>
<h3>随机抽一本</h3>
<p>让书单替你决定下一本，不再只收藏不开始。</p>
</div>
<button id="pickBtn">抽一本</button>
</div>
</section>
<div class="result-meta">
<div id="resultText"></div>
<div id="activeFilter"></div>
</div>
<div id="content"></div>
<div class="empty" id="emptyState"><strong>没有找到书籍</strong>换个关键词，或切换类目/阅读状态。</div>
</main>
</div>
<div class="modal" id="bookModal">
<div class="dialog">
<div class="dialog-head">
<h3 id="modalTitle">添加书籍</h3>
<button class="dialog-close" id="modalClose">×</button>
</div>
<form class="form" id="bookForm">
<div class="field"><label for="bookTitle">书名 *</label><input id="bookTitle" required=""/></div>
<div class="field"><label for="bookAuthor">作者</label><input id="bookAuthor"/></div>
<div class="two-col">
<div class="field"><label for="bookTheme">主题</label><select id="bookTheme"></select></div>
<div class="field">
<label for="bookCategory">类目 *</label>
<input id="bookCategory" list="categoryList" placeholder="选择或输入新类目" required=""/>
<datalist id="categoryList"></datalist>
</div>
</div>
<div class="field"><label for="bookIntro">一句话说明</label><textarea id="bookIntro" placeholder="写下为什么想读，或它适合解决什么问题"></textarea></div>
<div class="check-line"><input id="bookRead" type="checkbox"/><label for="bookRead">已读</label></div>
<div class="form-actions">
<button class="btn danger hidden" id="deleteBook" type="button">删除</button>
<button class="btn" id="cancelModal" type="button">取消</button>
<button class="btn primary" type="submit">保存</button>
</div>
</form>
</div>
</div>
<input accept="application/json,.json" class="hidden" id="importFile" type="file"/>

<script>
    const STORAGE_KEY = "chenyanqiu-booklist-v2";
    const seed = JSON.parse(document.getElementById("seedData").textContent);
    const themeMap = Object.fromEntries(seed.themes.map(theme => [theme.id, theme]));
    let state = loadState();
    let filters = { query: "", theme: "all", category: null, status: "all" };
    let editingId = null;
    let toastTimer = null;

    const els = {
      search: document.getElementById("searchInput"),
      clearSearch: document.getElementById("clearSearch"),
      content: document.getElementById("content"),
      empty: document.getElementById("emptyState"),
      resultText: document.getElementById("resultText"),
      activeFilter: document.getElementById("activeFilter"),
      sideNav: document.getElementById("sideNav"),
      statTotal: document.getElementById("statTotal"),
      statRead: document.getElementById("statRead"),
      statUnread: document.getElementById("statUnread"),
      statRate: document.getElementById("statRate"),
      modal: document.getElementById("bookModal"),
      modalTitle: document.getElementById("modalTitle"),
      form: document.getElementById("bookForm"),
      title: document.getElementById("bookTitle"),
      author: document.getElementById("bookAuthor"),
      theme: document.getElementById("bookTheme"),
      category: document.getElementById("bookCategory"),
      categoryList: document.getElementById("categoryList"),
      intro: document.getElementById("bookIntro"),
      read: document.getElementById("bookRead"),
      deleteBook: document.getElementById("deleteBook"),
      spotlight: document.getElementById("spotlight"),
      importFile: document.getElementById("importFile"),
      toast: document.getElementById("toast")
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (error) { console.warn(error); }
      return JSON.parse(JSON.stringify(seed));
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function ensureCategories() {
      state.categories = state.categories.filter(category => state.books.some(book => book.category === category.name && book.theme === category.theme));
      const known = new Set(state.categories.map(category => category.id));
      state.books.forEach(book => {
        const id = `${book.theme}::${book.category}`;
        if (!known.has(id)) {
          state.categories.push({
            id, theme: book.theme, name: book.category,
            description: themeMap[book.theme]?.description || "",
            isNew: false
          });
          known.add(id);
        }
      });
      state.categories.sort((a, b) => {
        const themeOrder = state.themes.map(theme => theme.id);
        return themeOrder.indexOf(a.theme) - themeOrder.indexOf(b.theme) || a.name.localeCompare(b.name, "zh-CN");
      });
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]));
    }

    function filteredBooks() {
      const query = filters.query.trim().toLowerCase();
      return state.books.filter(book => {
        if (filters.theme !== "all" && book.theme !== filters.theme) return false;
        if (filters.category && book.category !== filters.category) return false;
        if (filters.status === "read" && !book.read) return false;
        if (filters.status === "unread" && book.read) return false;
        if (!query) return true;
        return [book.title, book.author, book.intro, book.note, book.category, themeMap[book.theme]?.name]
          .join(" ").toLowerCase().includes(query);
      });
    }

    function renderSidebar() {
      const total = state.books.length;
      const read = state.books.filter(book => book.read).length;
      els.statTotal.textContent = total;
      els.statRead.textContent = read;
      els.statUnread.textContent = total - read;
      els.statRate.textContent = total ? Math.round(read / total * 100) + "%" : "0%";

      const themeCounts = Object.fromEntries(state.themes.map(theme => [theme.id, 0]));
      state.books.forEach(book => themeCounts[book.theme] = (themeCounts[book.theme] || 0) + 1);

      let nav = `<button class="side-all ${filters.theme === "all" && !filters.category ? "active" : ""}" data-theme="all"><span>全部书籍</span><span>${total}</span></button>`;
      state.themes.forEach(theme => {
        const cats = state.categories.filter(category => category.theme === theme.id);
        if (!cats.length) return;
        nav += `<details class="side-theme" ${filters.theme === theme.id ? "open" : ""} style="--accent:${theme.accent}">
          <summary><span class="theme-dot"></span><b>${escapeHtml(theme.name)}</b><small>${themeCounts[theme.id] || 0}</small></summary>
          <div class="side-categories">`;
        cats.forEach(category => {
          const count = state.books.filter(book => book.theme === category.theme && book.category === category.name).length;
          nav += `<button class="side-cat ${filters.category === category.name && filters.theme === category.theme ? "active" : ""}" data-theme="${theme.id}" data-category="${escapeHtml(category.name)}"><span>${count}</span>${escapeHtml(category.name)}</button>`;
        });
        nav += `</div></details>`;
      });
      els.sideNav.innerHTML = nav;
    }

    function renderContent() {
      const books = filteredBooks();
      const categoryMap = new Map(state.categories.map(category => [category.id, category]));
      const groups = new Map();
      books.forEach(book => {
        const key = `${book.theme}::${book.category}`;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(book);
      });

      const orderedKeys = state.categories
        .map(category => category.id)
        .filter(key => groups.has(key));

      els.content.innerHTML = orderedKeys.map(key => {
        const category = categoryMap.get(key);
        const theme = themeMap[category.theme];
        const items = groups.get(key);
        const readCount = items.filter(book => book.read).length;
        return `<section class="category-section">
          <div class="category-head">
            <div><h3>${escapeHtml(category.name)}</h3><p>${escapeHtml(category.description || theme?.description || "")}</p></div>
            <div class="category-numbers">${items.length} 本</div>
          </div>
          <div class="book-grid">${items.map(renderBook).join("")}</div>
        </section>`;
      }).join("");

      els.empty.style.display = books.length ? "none" : "block";
      const unread = state.books.filter(book => !book.read).length;
      els.resultText.innerHTML = `显示 <strong>${books.length}</strong> 本 · 共 <strong>${state.books.length}</strong> 本`;
      const labels = [];
      if (filters.theme !== "all") labels.push(themeMap[filters.theme]?.name || "");
      if (filters.category) labels.push(filters.category);
      if (filters.status === "read") labels.push("只看已读");
      if (filters.status === "unread") labels.push("只看未读");
      if (filters.query) labels.push(`搜索：${filters.query}`);
      els.activeFilter.textContent = labels.filter(Boolean).join(" · ");
    }

    function renderBook(book) {
      const theme = themeMap[book.theme];
      return `<article class="book-card ${book.read ? "read" : ""}" data-id="${book.id}">
        <div class="card-top">
          <div class="badges">
            <span class="badge">${escapeHtml(theme?.name || "")}</span>
            ${book.read ? '<span class="badge read">已读</span>' : ""}
            ${book.isNew ? '<span class="badge new">新增</span>' : ""}
          </div>
          <div class="card-actions">
            <button class="icon-btn edit" title="编辑">✎</button>
            <button class="icon-btn danger delete" title="删除">×</button>
          </div>
        </div>
        <h3 class="book-title">${escapeHtml(book.title)}</h3>
        <div class="author">${escapeHtml(book.author || "作者未注明")}</div>
        <p class="intro">${escapeHtml(book.intro || "还没有写说明，点击编辑补充。")}</p>
        ${book.note ? `<div class="book-note">${escapeHtml(book.note)}</div>` : ""}
        <div class="card-foot">
          <span class="read-state ${book.read ? "done" : ""}">${book.read ? "✓ 已读" : "未读"}</span>
          <button class="read-toggle">${book.read ? "标为未读" : "标记已读"}</button>
        </div>
      </article>`;
    }

    function renderAll() {
      ensureCategories();
      renderSidebar();
      renderContent();
    }

    function openModal(book = null) {
      editingId = book?.id || null;
      els.modalTitle.textContent = book ? "编辑书籍" : "添加书籍";
      els.title.value = book?.title || "";
      els.author.value = book?.author || "";
      els.theme.value = book?.theme || filters.theme !== "all" && filters.theme || state.themes[0]?.id || "";
      els.category.value = book?.category || (filters.category || "");
      els.intro.value = book?.intro || "";
      els.read.checked = Boolean(book?.read);
      els.deleteBook.classList.toggle("hidden", !book);
      refreshCategoryOptions();
      els.modal.classList.add("open");
      setTimeout(() => els.title.focus(), 30);
    }

    function closeModal() {
      els.modal.classList.remove("open");
      editingId = null;
    }

    function refreshCategoryOptions() {
      const options = state.categories
        .filter(category => category.theme === els.theme.value)
        .map(category => `<option value="${escapeHtml(category.name)}"></option>`)
        .join("");
      els.categoryList.innerHTML = options;
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      els.toast.textContent = message;
      els.toast.classList.add("show");
      toastTimer = setTimeout(() => els.toast.classList.remove("show"), 1800);
    }

    function saveBook(event) {
      event.preventDefault();
      const title = els.title.value.trim();
      if (!title) return;
      const theme = els.theme.value;
      const category = els.category.value.trim();
      const intro = els.intro.value.trim() || `${els.author.value.trim() ? els.author.value.trim() + "作品，" : ""}收录于「${category}」，可作为该主题的延伸阅读。`;
      const payload = {
        title,
        author: els.author.value.trim(),
        theme,
        category,
        intro,
        read: els.read.checked,
        updatedAt: new Date().toISOString()
      };
      if (editingId) {
        const book = state.books.find(item => item.id === editingId);
        if (book) Object.assign(book, payload);
        showToast("书籍已更新");
      } else {
        state.books.push({
          ...payload,
          id: crypto.randomUUID ? crypto.randomUUID() : "book-" + Date.now(),
          note: "",
          isNew: true,
          addedAt: new Date().toISOString().slice(0, 10)
        });
        showToast("已加入书单");
      }
      saveState();
      closeModal();
      renderAll();
    }

    function deleteBook() {
      if (!editingId) return;
      const book = state.books.find(item => item.id === editingId);
      if (!book) return;
      if (!confirm(`确定删除《${book.title}》吗？`)) return;
      state.books = state.books.filter(item => item.id !== editingId);
      saveState();
      closeModal();
      renderAll();
      showToast("已删除");
    }

    function toggleRead(id) {
      const book = state.books.find(item => item.id === id);
      if (!book) return;
      book.read = !book.read;
      book.updatedAt = new Date().toISOString();
      saveState();
      renderAll();
      showToast(book.read ? "已标记为已读" : "已标为未读");
    }

    function randomUnread() {
      const allUnread = state.books.filter(book => !book.read);
      if (!allUnread.length) {
        showToast("全部读完了，厉害。");
        return;
      }
      const clean = allUnread.filter(book => book.title.length <= 34 && (book.title.match(/《/g) || []).length <= 1);
      const unread = clean.length ? clean : allUnread;
      const book = unread[Math.floor(Math.random() * unread.length)];
      const theme = themeMap[book.theme];
      els.spotlight.innerHTML = `<div>
        <small>TODAY'S PICK · ${escapeHtml(theme?.name || "")}</small>
        <h3>《${escapeHtml(book.title)}》</h3>
        <p>${escapeHtml(book.author || "作者未注明")} · ${escapeHtml(book.category)}</p>
      </div><button id="pickAgain">换一本</button>`;
      document.getElementById("pickAgain").addEventListener("click", randomUnread);
      els.spotlight.dataset.bookId = book.id;
    }

    function exportData() {
      const payload = { version: 2, exportedAt: new Date().toISOString(), data: state };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `我的书单备份_${new Date().toISOString().slice(0, 10)}.json`;
      link.click();
      URL.revokeObjectURL(url);
      showToast("备份已导出");
    }

    function importData(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          const imported = parsed.data || parsed;
          if (!imported.books || !imported.themes) throw new Error("格式不正确");
          if (!confirm("导入会替换当前书单数据，已读状态也会以备份为准。继续吗？")) return;
          state = imported;
          saveState();
          renderAll();
          showToast("备份已导入");
        } catch (error) {
          alert("导入失败：文件格式不正确");
        }
      };
      reader.readAsText(file, "utf-8");
    }

    els.search.addEventListener("input", () => {
      filters.query = els.search.value;
      els.clearSearch.style.display = filters.query ? "block" : "none";
      renderContent();
    });
    els.clearSearch.addEventListener("click", () => {
      els.search.value = "";
      filters.query = "";
      els.clearSearch.style.display = "none";
      renderContent();
      els.search.focus();
    });
    document.querySelectorAll(".status-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        filters.status = tab.dataset.status;
        document.querySelectorAll(".status-tab").forEach(item => item.classList.toggle("active", item === tab));
        renderContent();
      });
    });
    els.sideNav.addEventListener("click", event => {
      const cat = event.target.closest(".side-cat");
      const all = event.target.closest(".side-all");
      if (all) {
        filters.theme = "all";
        filters.category = null;
        renderAll();
        return;
      }
      if (cat) {
        filters.theme = cat.dataset.theme;
        filters.category = cat.dataset.category;
        renderAll();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });
    els.content.addEventListener("click", event => {
      const card = event.target.closest(".book-card");
      if (!card) return;
      const id = card.dataset.id;
      if (event.target.closest(".read-toggle")) return toggleRead(id);
      if (event.target.closest(".edit")) return openModal(state.books.find(book => book.id === id));
      if (event.target.closest(".delete")) {
        editingId = id;
        return deleteBook();
      }
    });
    els.spotlight.addEventListener("click", event => {
      const id = els.spotlight.dataset.bookId;
      if (event.target.id === "pickBtn" || event.target.id === "pickAgain") return randomUnread();
      if (event.target.closest("h3") && id) {
        const book = state.books.find(item => item.id === id);
        if (book) openModal(book);
      }
    });
    document.getElementById("topAdd").addEventListener("click", () => openModal());
    document.getElementById("sideAdd").addEventListener("click", () => openModal());
    document.getElementById("randomTop").addEventListener("click", randomUnread);
    document.getElementById("randomSide").addEventListener("click", randomUnread);
    els.modal.addEventListener("click", event => { if (event.target === els.modal) closeModal(); });
    document.getElementById("modalClose").addEventListener("click", closeModal);
    document.getElementById("cancelModal").addEventListener("click", closeModal);
    els.form.addEventListener("submit", saveBook);
    els.theme.addEventListener("change", refreshCategoryOptions);
    els.deleteBook.addEventListener("click", deleteBook);
    document.getElementById("exportBtn").addEventListener("click", exportData);
    document.getElementById("importBtn").addEventListener("click", () => els.importFile.click());
    els.importFile.addEventListener("change", event => {
      const file = event.target.files?.[0];
      if (file) importData(file);
      event.target.value = "";
    });

    ensureCategories();
    els.theme.innerHTML = state.themes.map(theme => `<option value="${theme.id}">${escapeHtml(theme.name)}</option>`).join("");
    renderAll();
    randomUnread();
  </script>
</body>
</html>
